<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register — CareConnect</title>
<link rel="stylesheet" href="../css/patient.css" />
</head>
<body>

  <div class="cc-topband">
    <div class="cc-logo">CareConnect</div>
    <div class="cc-tagline">Your clinic, made a little easier to reach.</div>
  </div>

  <div class="cc-card">
    <h1>Create your patient account</h1>
    <p class="cc-sub">A few details so we can book your appointments correctly.</p>

    <svg class="cc-pulse" viewBox="0 0 300 28" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 14 H100 L112 4 L124 24 L136 14 H300" />
    </svg>

    <div id="formMessage" class="cc-message" role="status" aria-live="polite"></div>

    <form id="registerForm">
      <div class="cc-row">
        <div class="cc-field">
          <label for="firstName">First name</label>
          <input type="text" id="firstName" name="firstName" maxlength="50" autocomplete="given-name" required />
        </div>
        <div class="cc-field">
          <label for="lastName">Last name</label>
          <input type="text" id="lastName" name="lastName" maxlength="50" autocomplete="family-name" required />
        </div>
      </div>

      <div class="cc-field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" maxlength="100" autocomplete="username" required />
      </div>

      <div class="cc-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required />
      </div>

      <div class="cc-row">
        <div class="cc-field">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" maxlength="20" autocomplete="tel" required />
        </div>
        <div class="cc-field">
          <label for="dateOfBirth">Date of birth</label>
          <input type="date" id="dateOfBirth" name="dateOfBirth" required />
        </div>
      </div>

      <div class="cc-field">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="" disabled selected>Select one</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="cc-field">
        <label for="address">Address (optional)</label>
        <textarea id="address" name="address" rows="2" maxlength="255" autocomplete="street-address"></textarea>
      </div>

      <button type="submit" class="cc-btn" id="submitBtn">Create account</button>
    </form>

    <p class="cc-alt">Already registered? <a href="login.html">Log in</a></p>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/patient-auth.js"></script>
</body>
</html>
