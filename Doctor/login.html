<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doctor Login — CareConnect</title>
<link rel="stylesheet" href="../css/patient.css" />
</head>
<body>

  <div class="cc-topband">
    <div class="cc-logo">CareConnect</div>
    <div class="cc-tagline">Doctor portal</div>
  </div>

  <div class="cc-card">
    <h1>Doctor login</h1>
    <p class="cc-sub">Access your schedule and patient visit notes.</p>

    <svg class="cc-pulse" viewBox="0 0 300 28" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 14 H100 L112 4 L124 24 L136 14 H300" />
    </svg>

    <div id="formMessage" class="cc-message" role="status" aria-live="polite"></div>

    <form id="doctorLoginForm">
      <div class="cc-field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="username" required />
      </div>

      <div class="cc-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>

      <button type="submit" class="cc-btn" id="submitBtn" data-label="Log in">Log in</button>
    </form>

    <p class="cc-alt">Not a doctor? <a href="../patient/login.html">Patient login</a> · <a href="../Admin/login.html">Admin login</a></p>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/doctor-auth.js"></script>
</body>
</html>
