<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book an Appointment — CareConnect</title>
<link rel="stylesheet" href="../css/patient.css" />
</head>
<body>

  <div class="cc-topbar">
    <div class="cc-logo" style="font-weight:700;color:var(--cc-teal-dark);">CareConnect</div>
    <nav>
      <a href="../patient/profile.html">Profile</a>
      <a href="../patient/appointments.html">My Appointments</a>
      <a href="book.html" class="cc-active">Book Appointment</a>
      <a href="../patient/medical-history.html">Medical History</a>
      <a href="#" id="logoutLink">Log out</a>
    </nav>
  </div>

  <div class="cc-card cc-wide">
    <h1>Book an appointment</h1>
    <p class="cc-sub">Pick a doctor, a day, then an open time slot.</p>

    <svg class="cc-pulse" viewBox="0 0 300 28" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 14 H100 L112 4 L124 24 L136 14 H300" />
    </svg>

    <div id="formMessage" class="cc-message" role="status" aria-live="polite"></div>

    <form id="bookingForm">
      <div class="cc-row">
        <div class="cc-field">
          <label for="doctorSelect">Doctor</label>
          <select id="doctorSelect" required>
            <option value="" disabled selected>Loading doctors…</option>
          </select>
        </div>
        <div class="cc-field">
          <label for="dateInput">Date</label>
          <input type="date" id="dateInput" required />
        </div>
      </div>

      <div class="cc-field">
        <label>Available time slots</label>
        <div id="slotGrid" class="cc-slot-grid">
          <p class="cc-sub" style="grid-column: 1 / -1;">Choose a doctor and date to see open slots.</p>
        </div>
        <input type="hidden" id="selectedTime" required />
      </div>

      <div class="cc-field">
        <label for="reason">Reason for visit</label>
        <textarea id="reason" rows="2" maxlength="255" placeholder="e.g. Routine check-up, follow-up, persistent cough"></textarea>
      </div>

      <button type="submit" class="cc-btn" id="submitBtn" data-label="Book appointment">Book appointment</button>
    </form>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/appointment-booking.js"></script>
</body>
</html>
